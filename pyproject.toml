[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-sec"
version = "2.0.0"
description = "Multi-step OpenEnv environment for cybersecurity alert triage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openenv-core>=0.2.0",
  "pydantic>=2.7,<3",
  "openai>=2.7.2,<3",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
packages = ["agent", "env", "graders", "server"]
