[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-cyber-vulnerability-triage"
version = "2.1.0"
description = "Multi-step OpenEnv environment for cybersecurity alert triage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openenv-core>=0.2.2",
  "pydantic>=2.7,<3",
  "openai>=2.7.2,<3",
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.6.0",
  "Sphinx>=7.0,<9",
  "myst-parser>=2,<4",
]
openenv = [
  "openenv-core>=0.2.2",
]
openenv-core = [
  "openenv-core[core]>=0.2.2",
]

[project.scripts]
# Canonical OpenEnv-style entrypoint
server = "cyber_vulnerability_triage.server.app:main"
cyber-triage-server = "cyber_vulnerability_triage.server.app:main"
cyber-triage-eval = "inference:main"

[tool.setuptools]
include-package-data = true
packages = [
  "cyber_vulnerability_triage",
  "cyber_vulnerability_triage.server",
  "agent",
  "env",
  "graders",
]
package-dir = { "cyber_vulnerability_triage" = ".", "cyber_vulnerability_triage.server" = "server" }

[tool.setuptools.package-data]
cyber_vulnerability_triage = ["openenv.yaml", "assets/*.svg"]
