name: cyber-vulnerability-triage
version: "2.0.0"
description: Multi-step OpenEnv environment for analyst-style cybersecurity alert triage.
entrypoint: env.environment.CyberVulnerabilityTriageEnvironment
observation_space:
  type: env.models.Observation
  fields:
    task: string
    request_id: string
    queue: string
    title: string
    method: string
    path: string
    headers: object
    query_params: object
    body: string
    source_ip: string
    user_agent: string
    instructions: string
    steps_taken: integer
    remaining_steps: integer
    available_artifacts: array
    collected_artifacts: array
    evidence_log: array
    available_action_types: array
    allowed_vulnerabilities: array
    allowed_severities: array
    allowed_actions: array
action_space:
  type: env.models.Action
  fields:
    action_type:
      enum:
        [
          inspect_payload,
          decode_obfuscation,
          review_history,
          check_source_reputation,
          inspect_asset_context,
          consult_playbook,
          submit_triage,
        ]
    vulnerability_type:
      enum: [safe, xss, sql_injection, command_injection, path_traversal, null]
    severity:
      enum: [none, low, medium, high, critical, null]
    response_action:
      enum: [allow, block, sanitize, monitor, null]
    explanation: string
reward_space:
  type: env.models.Reward
  fields:
    score: float
    step_score: float
    terminal_score: float
    investigation_score: float
    decision_score: float
    efficiency_score: float
    safety_penalty: float
    feedback: string
tasks:
  - name: easy
    goal: Determine whether the alert is benign or malicious and name the vulnerability family.
  - name: medium
    goal: Investigate the alert and classify both vulnerability type and severity.
  - name: hard
    goal: Complete full analyst triage with context gathering, severity, response action, and explanation.
